	<script>
	    var m;

		function checkErrorMessage() {
			var errorMessage = document.getElementById( "error-message" ),
			 	usernameInput = document.getElementById( "username-input" ),
			 	passwordInput = document.getElementById( "password-input" );

			if ( errorMessage && errorMessage.textContent ) {
				errorMessage.style.display = ( errorMessage.textContent ) ? "block" : "none";
				errorMessage.focus();
				if ( usernameInput ) {
					usernameInput.setAttribute( "aria-invalid", "true" );
				}
				if ( passwordInput ) {
					passwordInput.setAttribute( "aria-invalid", "true" );
				}
			}
			else if ( usernameInput ) {
				usernameInput.focus();
			}
		}

	    function init() {
	        checkErrorMessage();
	    }

	    function scrollToCorrectPos() {
	        if ( m.matches && window.scrollTo ) {
	            window.scrollTo( 0, 0 );
	        }
	    }

	    function setupSmallDeviceMql() {
	        return window.matchMedia( "screen and (max-width: 640px) and (orientation: landscape)" );
	    }

	    m = setupSmallDeviceMql();
	    scrollToCorrectPos();

	    .sense-login-container
	    {
	        margin-left: auto;
	        margin-right: auto;
	        max-width: 280px;
	        font-size: 13px;
	        background: #ffffff;
	        position: relative;
	        z-index: 2;
			padding-top: 20px;
	    }

	    form#login-form
	    {
	        padding-top: 13px;
	        display: block;
	    }

	    .lui-input
	    {
			vertical-align: middle;
			width: 100%;
			height: 28px;
			display: block;
			outline: none;
			font-size: 13px;
			padding: 3px 6px;
			border: 1px solid transparent;
			border-radius: 3px;
			-webkit-appearance: none;
			-moz-appearance: none;
			box-sizing: border-box;
			box-shadow: none;
			transition: border-color 200ms ease-out;
			color: #595959;
			background-color: #FFFFFF;
			border-color: #B3B3B3;
	    }
		
	    .lui-input:hover
	    {
  			border-color: #666666;
	    }

		.lui-input:focus
		{
			border: 1px solid #52a2cc;
			transition: none;
			box-shadow: 0 0 1px 1px rgba(82, 162, 204, 0.7);
		}

		input {
	        margin-top: 5px;
	        margin-bottom: 10px;
		}

	    .lui-button
	    {
			vertical-align: middle;
			height: 28px;
			min-width: 44px;
			padding: 0 16px;
			border: 1px solid transparent;
			font-size: 13px;
			font-weight: bold;
			text-decoration: none;
			line-height: 24px;
			position: relative;
			outline: none;
			cursor: pointer;
			box-sizing: border-box;
			-webkit-appearance: none;
			-moz-appearance: none;
			-webkit-user-select: none;
			-moz-user-select: none;
			-ms-user-select: none;
			border-radius: 3px;
			color: #595959;
			background-color: transparent;
			border-color: #B3B3B3;
			transition: border-color 200ms ease-out;
	    }

		.lui-button:hover {
			border-color: #666666;
		}
		.lui-button:active{
			color: #FFFFFF;
			background-color: rgba(0, 0, 0, 0.65);
			border-color: transparent;
			box-shadow: 0 1px 0 rgba(255, 255, 255, 0.25);
		}
		.lui-button:focus {
			border: 1px solid #52a2cc;
			transition: none;
			box-shadow: 0 0 1px 1px rgba(82, 162, 204, 0.7);
		}
		.lui-button:focus:active {
			box-shadow: 0 1px 0 rgba(255, 255, 255, 0.25);
		}

		#loginbtn {
			float: right;
			margin: 10px 0 0 0;
		}

		.error-message {
			display: none;
			color: rgba(230, 78, 78, 1.0);
			background-color: rgba(230, 78, 78, 0.1);
			cursor: default;
			padding: 10px 10px 10px 10px;
			border: 1px solid rgba(230, 78, 78, 0.3);
			-webkit-border-radius: 6px;
			-moz-border-radius: 6px;
			border-radius: 3px;
			clear: both;
			-webkit-text-overflow: ellipsis;
			text-overflow: ellipsis;
			overflow: hidden;
			outline: none;
			margin-bottom: 10px;
		}

		.error-message:focus {
			box-shadow: 0 0 1px 1px rgba(230, 78, 78, 0.7);
		}

	    .js-disabled
	    {
	        display: block !important;
	        max-width: 280px;
	    }

	    .jsDisabledMsg
	    {
	        margin-bottom: 0;
	    }

		.hidden {
			display: none;
		}

	    @media screen and (min-width: 768px)
	    {
	        .left-qlik-background
	        {
	            display: block;
	            z-index: 1;
	            width: 189px;
	            height: 346px;
	            background-size: auto 346px;
	            background-position: -110px 50%;
	            top: 200px;
	        }

	        input[type='submit']
	        {
	            min-width: 44px;
	        }
	    }

	    @media screen and (min-width: 768px) and (min-height: 481px)
		{
			.sense-login-container
			{
				padding-top: 120px;
			}
		}

	    @media screen and (max-width: 768px) and (orientation: landscape)
		{
	        .left-qlik-background
	        {
	            width: 169px;
	            height: 175px;
	            background-size: auto 175px;
	            background-position: -60px 50%;
	            top: 200px;
	        }
	    }

	    @media screen and (max-width: 768px) and (orientation: portrait)
	    {
	        .left-qlik-background
	        {
				display: none;
			}

			.bottom-qlik-background {
				width: 100%;
				height: 446px;
				background-size: auto 446px;
				display: block;
				bottom: 0;
				background-position: 50% 150px;
			}
	    }

	    @media screen and (max-width: 640px) and (orientation: portrait)
	    {
	        .left-qlik-background
	        {
				display: none;
			}

	        .bottom-qlik-background
			{
	            width: 100%;
	            height: 35%;
	            background-size: 50% auto;
	            display: block;
	            bottom: 0;
	            background-position: 50% 30px;
	        }

	        input[type='submit']
	        {
	            min-width: 100%;
	            margin-top: 40px;
			}
		}

	    @media screen and (max-width: 640px) and (orientation: landscape)
	    {
	        .left-qlik-background
			{
	            display: none;
			}

	        .bottom-qlik-background
	        {
	            display: none;
			}
		}
	</style>
