name: Testes

# roda a cada envio: os testes do Python (coleta) e os do app (JavaScript)
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Testes da coleta (Python)
        run: python -m unittest discover -s tests -q
      - name: Testes do app (JavaScript)
        run: node --test tests/*.mjs
