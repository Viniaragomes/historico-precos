name: Investigar fontes

# Lê robots.txt, página inicial e cabeçalhos das fontes que falharam, sem contornar nada.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  investigar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Investigar
        run: python ferramentas/investigar_fontes.py relatorios/investigacao
      - name: Mapa de Preços do DF pelo Qlik (como a página pública)
        continue-on-error: true
        run: python -m historico_precos --banco /tmp/t.db mapa-df qlik --saida relatorios/investigacao/mapa-df-qlik.json --linhas 25
      - name: Guardar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relatorios/investigacao
          git commit -m "Investigação das fontes $(date +%F)" || exit 0
          git pull --rebase origin main && git push
