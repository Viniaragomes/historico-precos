name: Investigar fontes

# Lê robots.txt, página inicial e cabeçalhos das fontes que falharam, sem contornar nada.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  investigar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Investigar
        run: python ferramentas/investigar_fontes.py relatorios/investigacao
      - name: Mapa de Preços do DF pelo Qlik (como a página pública)
        continue-on-error: true
        run: python -m historico_precos --banco /tmp/t.db mapa-df qlik --saida relatorios/investigacao/mapa-df-qlik.json --linhas 25
      - name: Preço de compra no DF (teste real com 5 códigos)
        continue-on-error: true
        timeout-minutes: 4
        run: |
          head -5 relatorios/amostra.tsv > /tmp/cinco.tsv
          python -m historico_precos --banco /tmp/t.db mapa-df precos --arquivo /tmp/cinco.tsv > relatorios/investigacao/mapa-df-precos.txt 2>&1 || true
      - name: Carrefour pelo sitemap e páginas de produto (teste real, 15 páginas)
        continue-on-error: true
        timeout-minutes: 8
        run: |
          python -m historico_precos --banco /tmp/c.db catalogo-sitemap --termos cafe --limite 15 > relatorios/investigacao/carrefour-sitemap.txt 2>&1 || true
          sqlite3 /tmp/c.db "SELECT ean, loja, preco, data_observada, descricao, url_evidencia FROM precos" >> relatorios/investigacao/carrefour-sitemap.txt 2>&1 || true
      - name: CEASA-DF, preço no atacado (teste real, 3 produtos)
        continue-on-error: true
        timeout-minutes: 5
        run: python -m historico_precos --banco /tmp/ceasa.db ceasa-df --produtos "TOMATE,BANANA PRATA,CEBOLA" > relatorios/investigacao/ceasa-df.txt 2>&1 || true
      - name: Guardar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relatorios/investigacao
          git commit -m "Investigação das fontes $(date +%F)" || exit 0
          git pull --rebase origin main && git push
